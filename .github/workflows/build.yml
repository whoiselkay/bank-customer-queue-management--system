name: Build C++ Application

on:
  push: 
    branches: [main]
jobs: 
  build: 
    runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Compile C++ program
    run: g++ -std=c++17 main.cpp -o bank

  - name: Test program
    run: |
      printf '4\n' | ./bank
